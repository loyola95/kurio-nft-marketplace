name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Gerar as baselines visuais de Linux (publicadas como artefato)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit

  e2e:
    runs-on: ubuntu-latest
    # Imagem oficial na mesma versão do @playwright/test: navegadores e fontes do sistema fixos.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Testes e2e e visuais
        if: ${{ !inputs.update_snapshots }}
        run: pnpm exec playwright test

      - name: Gerar baselines visuais de Linux
        if: ${{ inputs.update_snapshots }}
        run: pnpm exec playwright test tests/visual --update-snapshots=all

      - name: Publicar baselines de Linux
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v4
        with:
          name: baselines-linux
          path: tests/visual/telas.spec.ts-snapshots/*-linux.png
          if-no-files-found: error

      - name: Publicar relatório e traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
